{% extends 'base.html' %}
{% block title %}New Project{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Create Project</div>
        <div class="page-subtitle">You'll become the admin automatically</div>
    </div>
    <a href="{{ url_for('projects.index') }}" class="btn btn-ghost">← Back</a>
</div>

<div style="max-width:520px">
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Project Name *</label>
                <input class="form-control" type="text" name="name" placeholder="e.g. Website Redesign" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" placeholder="What is this project about?"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Project Color</label>
                <div style="display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:0.5rem" id="color-picker">
                    {% for color in colors %}
                    <label style="cursor:pointer">
                        <input type="radio" name="color" value="{{ color }}" {% if loop.first %}checked{% endif %} style="display:none">
                        <div class="color-swatch" style="width:32px;height:32px;border-radius:50%;background:{{ color }};transition:all 0.15s" data-color="{{ color }}"></div>
                    </label>
                    {% endfor %}
                </div>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
                <button type="submit" class="btn btn-primary">Create Project</button>
                <a href="{{ url_for('projects.index') }}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
document.querySelectorAll('#color-picker input[type=radio]').forEach(radio => {
    function update(r) {
        document.querySelectorAll('.color-swatch').forEach(s => s.style.outline = 'none');
        r.nextElementSibling.style.outline = '3px solid white';
        r.nextElementSibling.style.outlineOffset = '2px';
    }
    if (radio.checked) update(radio);
    radio.addEventListener('change', () => update(radio));
});
</script>
{% endblock %}
