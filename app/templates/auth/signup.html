<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — TaskFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0d0f14; --surface: #141720; --surface2: #1c2030; --border: #252a3a; --border2: #2e3550;
            --accent: #7c6af7; --accent2: #a78bfa; --accent-glow: rgba(124,106,247,0.15);
            --text: #e8eaf0; --text-muted: #6b7394; --text-dim: #3d4460; --radius: 10px;
        }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth-card { width: 100%; max-width: 400px; }
        .auth-logo { font-family: 'Space Mono', monospace; font-size: 1.3rem; color: var(--accent2); margin-bottom: 2rem; text-align: center; }
        .auth-logo span { color: var(--text-muted); }
        .auth-form-title { font-family: 'Space Mono', monospace; font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; }
        .auth-form-sub { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem; }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.4rem; }
        .form-control { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 0.7rem 1rem; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; transition: all 0.15s; }
        .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .form-control::placeholder { color: var(--text-dim); }
        .btn-primary { display: flex; align-items: center; justify-content: center; width: 100%; padding: 0.75rem; background: var(--accent); color: white; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 0.5rem; }
        .btn-primary:hover { background: #6a58e6; }
        .auth-switch { text-align: center; margin-top: 1.25rem; font-size: 0.875rem; color: var(--text-muted); }
        .auth-switch a { color: var(--accent2); text-decoration: none; font-weight: 500; }
        .flash { padding: 0.65rem 1rem; border-radius: 8px; font-size: 0.825rem; margin-bottom: 0.5rem; border: 1px solid; }
        .flash-error { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.3); color: #f87171; }
        .flash-success { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.3); color: #4ade80; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-logo">task<span>//</span>flow</div>
    <div class="auth-form-title">Create account</div>
    <div class="auth-form-sub">Join your team on TaskFlow</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="name">Full name</label>
            <input class="form-control" type="text" id="name" name="name" value="{{ name or '' }}" placeholder="Alex Johnson" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ email or '' }}" placeholder="you@company.com" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" placeholder="Min. 6 characters" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm password</label>
            <input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Create account →</button>
    </form>

    <div class="auth-switch">
        Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
</div>
</body>
</html>
