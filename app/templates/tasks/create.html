{% extends 'base.html' %}
{% block title %}New Task — {{ project.name }}{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <div class="page-title">Create Task</div>
        <div class="page-subtitle" style="display:flex;align-items:center;gap:0.5rem">
            <div class="color-dot" style="background:{{ project.color }}"></div>
            {{ project.name }}
        </div>
    </div>
    <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-ghost">← Back</a>
</div>

<div style="max-width:560px">
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Task Title *</label>
                <input class="form-control" type="text" name="title" placeholder="What needs to be done?" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" placeholder="Add more context, acceptance criteria, etc." style="min-height:100px"></textarea>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select class="form-control" name="priority">
                        {% for p in priorities %}
                        <option value="{{ p }}" {% if p == 'medium' %}selected{% endif %}>{{ p.title() }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-control" name="status">
                        {% for s in statuses %}
                        <option value="{{ s }}">{{ s.replace('_', ' ').title() }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Assign To</label>
                    <select class="form-control" name="assigned_to">
                        <option value="">Unassigned</option>
                        {% for user, role in members %}
                        <option value="{{ user.id }}">{{ user.name }} ({{ role }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Due Date</label>
                    <input class="form-control" type="date" name="due_date">
                </div>
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:0.5rem">
                <button type="submit" class="btn btn-primary">Create Task</button>
                <a href="{{ url_for('projects.detail', project_id=project.id) }}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
